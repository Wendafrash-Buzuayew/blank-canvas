server:
  port: 8087

spring:
  application:
    name: auth-service
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/qrserve_auth}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
      max-lifetime: 1800000
      connection-timeout: 20000
  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO:update}
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: ${SHOW_SQL:true}
  flyway:
    enabled: false

jwt:
  secret: ${JWT_SECRET}
  access-expiration-ms: 3600000
  refresh-expiration-ms: 604800000

# The tenant base domain. Required, with no default: PublicMenuUrl is a
# @Component in com.qrserve.shared.common, which every one of these services
# component-scans, and a default would let a service start while emitting QR
# codes that point at the wrong host. A wrong-but-plausible printed QR code is
# discovered by a customer holding a phone; a startup failure is discovered by
# whoever ran the deploy.
app:
  public-base-domain: ${PUBLIC_BASE_DOMAIN}
  public-url-scheme: ${PUBLIC_URL_SCHEME:https}

qr:
  signature-secret: ${QR_SIGNATURE_SECRET}
  # Verify-only. Set to the OUTGOING secret during a rotation so QR codes
  # already printed onto table stands keep validating; clear it once
  # reprinting is done. Signing always uses signature-secret above.
  signature-secret-previous: ${QR_SIGNATURE_SECRET_PREVIOUS:}

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus, metrics
  endpoint:
    health:
      show-details: when_authorized
  tracing:
    sampling:
      probability: ${TRACE_SAMPLE_RATE:0.1} # Override via TRACE_SAMPLE_RATE (e.g. 1.0 locally); keep low in production

logging:
  pattern:
    level: "%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]"

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka}
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: true
