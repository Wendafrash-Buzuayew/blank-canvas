plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.0' apply false
    id 'io.spring.dependency-management' version '1.1.7' apply false
}

allprojects {
    group = 'com.qrserve'
    version = '1.0.0-SNAPSHOT'

    repositories {
        mavenCentral()
    }
}

// 1. Base tools and dependencies for ALL projects
subprojects {
    apply plugin: 'java-library'
    apply plugin: 'io.spring.dependency-management'

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(17)
        }
    }

    dependencyManagement {
        imports {
            mavenBom "org.springframework.boot:spring-boot-dependencies:4.1.0"
            mavenBom "org.springframework.cloud:spring-cloud-dependencies:2025.1.2"
        }
    }

    configurations {
        compileOnly {
            extendsFrom annotationProcessor
        }
    }

    dependencies {
        // JJWT Dependencies
        api 'io.jsonwebtoken:jjwt-api:0.12.6'
        runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
        runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'

        // Lombok & Mapstruct
        compileOnly 'org.projectlombok:lombok'
        annotationProcessor 'org.projectlombok:lombok'
        annotationProcessor 'org.mapstruct:mapstruct-processor:1.6.0'
        implementation 'org.mapstruct:mapstruct:1.6.0'

        // Testing
        testImplementation 'org.springframework.boot:spring-boot-starter-test'
        // REQUIRED with Spring Boot 4.1: the BOM manages junit-jupiter 6.0.3, i.e.
        // JUnit Platform 6.x. When a project does not declare a launcher itself,
        // Gradle 8.14 injects its own bundled junit-platform-launcher 1.x, and the
        // mismatched engine/launcher pair fails discovery with
        // "OutputDirectoryCreator not available" before a single test runs.
        // Declaring it here takes the BOM-aligned 6.x launcher instead.
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    }

    test {
        useJUnitPlatform()
    }
}

// 2. Standard Business Microservices (EXCLUDING api-gateway, discovery-service, and shared)
def standardBusinessServices = subprojects.findAll { 
    it.name != 'api-gateway' && it.name != 'discovery-service' && !it.path.startsWith(':shared') 
}

configure(standardBusinessServices) {
    dependencies {
        // Boot 4.x: use default embedded Tomcat (Undertow starter has no stable 4.x release).
        // starter-webmvc is the Boot 4 name for the servlet MVC stack; verified to be a
        // superset of the old starter-web (same spring-boot-starter-tomcat, plus
        // spring-boot-starter), so the embedded container is unchanged.
        api 'org.springframework.boot:spring-boot-starter-webmvc'
        api 'org.springframework.boot:spring-boot-starter-data-jpa'
        api 'org.springframework.boot:spring-boot-starter-security'
        api 'org.springframework.boot:spring-boot-starter-websocket'
        api 'org.springframework.boot:spring-boot-starter-actuator'
        api 'org.springframework.boot:spring-boot-starter-data-redis'
        // Deliberately NOT swapped for spring-boot-starter-kafka. This already
        // resolves to the BOM-managed spring-kafka 4.1.0, the starter adds nothing
        // functional (Kafka auto-configuration lives in spring-boot-autoconfigure),
        // and its transitive set could not be verified offline. Not worth an
        // unverifiable change on the event pipeline for naming consistency.
        api 'org.springframework.kafka:spring-kafka'
        api 'org.springframework.cloud:spring-cloud-starter-netflix-eureka-client'

        implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.1.0'
        implementation 'com.google.zxing:core:3.5.3'
        implementation 'com.google.zxing:javase:3.5.3'

        runtimeOnly 'com.h2database:h2'
        runtimeOnly 'org.postgresql:postgresql'
        testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
    }
}

// 3. Shared Modules Setup
project(':shared:common') {
    dependencies {
        implementation 'org.springframework.boot:spring-boot-starter-validation'
    }
}

project(':shared:exceptions') {
    dependencies {
        implementation project(':shared:common')
        implementation 'org.springframework:spring-web'
        implementation 'org.springframework:spring-context'
        implementation 'org.springframework.boot:spring-boot-starter-validation'
        // compileOnly: GlobalExceptionHandler needs Spring Security's
        // AccessDeniedException to map authorization failures to 403 instead of
        // letting them fall through to the catch-all as a 500. Every microservice
        // that consumes shared:exceptions also consumes shared:security (see the
        // `configure(microservices)` block), so the class is always present at
        // runtime — this module just must not force security onto anything else.
        compileOnly 'org.springframework.boot:spring-boot-starter-security'
    }
}

project(':shared:security') {
    dependencies {
        implementation project(':shared:common')
        implementation 'org.springframework.boot:spring-boot-starter-security'
        implementation 'org.springframework.boot:spring-boot-starter-webmvc'
        compileOnly 'jakarta.servlet:jakarta.servlet-api'
    }
}

project(':shared:events') {
    dependencies {
        implementation 'org.springframework:spring-context'
    }
}

// 4. Configure Executable Microservices
def microservices = [
    ':discovery-service',
    ':auth-service',
    ':merchant-service',
    ':menu-service',
    ':order-service',
    ':qr-service',
    ':notification-service',
    ':analytics-service',
    ':api-gateway'
]

configure(microservices.collect { project(it) }) { p ->
    apply plugin: 'org.springframework.boot'

    dependencies {
        implementation project(':shared:common')

        // MVC-specific shared modules applied ONLY to standard business microservices
        if (p.name != 'api-gateway' && p.name != 'discovery-service') {
            implementation project(':shared:exceptions')
            implementation project(':shared:security')
        }
    }

    bootJar {
        enabled = true
        archiveClassifier = 'boot'
    }

    jar {
        enabled = true
        archiveClassifier = ''
    }
}

// 5. Inter-Service Code Imports & Configurations
project(':auth-service') {
    springBoot { mainClass = 'com.qrserve.auth.AuthServiceApplication' }
}

project(':merchant-service') {
    springBoot { mainClass = 'com.qrserve.merchant.MerchantServiceApplication' }
    dependencies {
        implementation project(':shared:events')
    }
}

project(':menu-service') {
    springBoot { mainClass = 'com.qrserve.menu.MenuServiceApplication' }
}

project(':qr-service') {
    springBoot { mainClass = 'com.qrserve.qr.QrServiceApplication' }
}

project(':order-service') {
    springBoot { mainClass = 'com.qrserve.order.OrderServiceApplication' }
    dependencies {
        implementation project(':shared:events')
    }
}

project(':notification-service') {
    springBoot { mainClass = 'com.qrserve.notification.NotificationServiceApplication' }
    dependencies {
        implementation project(':shared:events')
    }
}

// FIX: Dedicated configuration for Discovery Service (Eureka Server)
project(':discovery-service') {
    springBoot { mainClass = 'com.qrserve.discovery.DiscoveryServiceApplication' }
    dependencies {
        implementation 'org.springframework.cloud:spring-cloud-starter-netflix-eureka-server'
    }
}

project(':analytics-service') {
    springBoot { mainClass = 'com.qrserve.analytics.AnalyticsServiceApplication' }
    dependencies {
        implementation project(':shared:events')
    }
}

// 6. Reactive API Gateway Configuration
project(':api-gateway') {
    dependencies {
        implementation 'org.springframework.boot:spring-boot-starter-webflux'
        implementation 'org.springframework.cloud:spring-cloud-gateway-server-webflux'
        implementation 'org.springframework.cloud:spring-cloud-starter-netflix-eureka-client'
        implementation 'org.springframework.boot:spring-boot-starter-data-redis-reactive'
        implementation 'org.springframework.cloud:spring-cloud-starter-circuitbreaker-reactor-resilience4j'

        // The tenant filter tests use MockServerWebExchange and MockServerHttpRequest.
        // Those live in spring-test, which spring-boot-starter-test already provides
        // via the subprojects block, but they operate on WebFlux server types that
        // must be present at test compile time too.
        testImplementation 'org.springframework.boot:spring-boot-starter-webflux'
    }

    // Explicitly prevent Spring MVC from entering the Gateway classpath. Both
    // starter names are excluded: Boot 4 renamed starter-web to starter-webmvc, so
    // excluding only the old name would leave this guard silently ineffective and
    // let a servlet stack onto a WebFlux classpath.
    configurations.all {
        exclude group: 'org.springframework.boot', module: 'spring-boot-starter-web'
        exclude group: 'org.springframework.boot', module: 'spring-boot-starter-webmvc'
        exclude group: 'org.springframework.boot', module: 'spring-boot-webmvc'
        exclude group: 'org.springframework', module: 'spring-webmvc'
    }

    springBoot {
        mainClass = 'com.qrserve.gateway.ApiGatewayApplication'
    }
}