server:
  port: 8086

spring:
  application:
    name: menu-service
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/qrserve_menu}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      idle-timeout: 30000
      max-lifetime: 1800000
      connection-timeout: 10000
  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO:update}
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    show-sql: ${SHOW_SQL:false}
  flyway:
    enabled: false
  cache:
    type: redis
    redis:
      time-to-live: 600000
      cache-null-values: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 4
          max-idle: 4
          min-idle: 0

services:
  merchant-service-url: ${MERCHANT_SERVICE_URL:http://localhost:8085}

jwt:
  secret: ${JWT_SECRET}
  access-expiration-ms: 3600000
  refresh-expiration-ms: 604800000

# The tenant base domain. Required, with no default: PublicMenuUrl is a
# @Component in com.qrserve.shared.common, which every one of these services
# component-scans, and a default would let a service start while emitting QR
# codes that point at the wrong host. A wrong-but-plausible printed QR code is
# discovered by a customer holding a phone; a startup failure is discovered by
# whoever ran the deploy.
app:
  public-base-domain: ${PUBLIC_BASE_DOMAIN}
  public-url-scheme: ${PUBLIC_URL_SCHEME:https}
  public-menu-domain: ${PUBLIC_MENU_DOMAIN}
  # Uploaded product images (real merchant photos, replacing hardcoded preset
  # URLs). "filesystem" (default) needs no external service - in a real
  # deployment upload-dir is a mounted PersistentVolumeClaim so files survive
  # pod restarts. "s3" points at any S3-compatible store (MinIO locally, real
  # AWS S3/equivalent in the cloud) - see S3MediaStorageService.
  media:
    backend: ${MEDIA_BACKEND:filesystem}
    upload-dir: ${MEDIA_UPLOAD_DIR:./uploads}
    public-base-path: ${MEDIA_PUBLIC_BASE_PATH:/api/media}
    s3:
      endpoint: ${MEDIA_S3_ENDPOINT:http://localhost:9000}
      region: ${MEDIA_S3_REGION:us-east-1}
      bucket: ${MEDIA_S3_BUCKET:qrserve-media}
      access-key: ${MEDIA_S3_ACCESS_KEY:}
      secret-key: ${MEDIA_S3_SECRET_KEY:}
      # The URL prefix customers' browsers actually resolve images from -
      # MinIO's own address locally, a CDN/public bucket URL in the cloud.
      public-url-base: ${MEDIA_S3_PUBLIC_URL_BASE:http://localhost:9000/qrserve-media}

qr:
  signature-secret: ${QR_SIGNATURE_SECRET}
  # Verify-only. Set to the OUTGOING secret during a rotation so QR codes
  # already printed onto table stands keep validating; clear it once
  # reprinting is done. Signing always uses signature-secret above.
  signature-secret-previous: ${QR_SIGNATURE_SECRET_PREVIOUS:}

# Safaricom ETHQR payment-QR generator (PaymentController / SafaricomEthQrService).
# A Pro-tier feature — the standee studio's payment QR toggle, not the digital
# menu's own QR. Empty api-key by default rather than a hard `:?` failure:
# unlike jwt.secret/qr.signature-secret above, this is genuinely optional, not
# just tolerated-while-broken — a real call to qr.safaricom.et with no
# Authorization header at all was confirmed to succeed, so an unconfigured
# environment calls the real endpoint successfully, not just boots without
# crashing. See SafaricomEthQrService's header comment.
safaricom:
  ethqr:
    base-url: ${SAFARICOM_QR_BASE_URL:https://qr.safaricom.et/api/qr/generate}
    api-key: ${SAFARICOM_QR_API_KEY:}

# One-off, opt-in migration (BranchMenuBackfillRunner): does nothing on every
# normal boot. Flip to true for exactly one deploy to give every existing
# branch its own independent copy of its merchant's current catalog, then
# flip back off.
backfill:
  branch-menus:
    enabled: ${BACKFILL_BRANCH_MENUS_ENABLED:false}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka}
    fetch-registry: true
    register-with-eureka: true
    registry-fetch-interval-seconds: 5
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus, metrics
  endpoint:
    health:
      show-details: when_authorized
  tracing:
    sampling:
      probability: ${TRACE_SAMPLE_RATE:0.1} # Override via TRACE_SAMPLE_RATE (e.g. 1.0 locally); keep low in production

logging:
  pattern:
    level: "%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]"