# QRServe required secrets — TEMPLATE ONLY.
#
# Do NOT commit a filled-in copy of this file. Values below are intentionally
# empty: every service now fails fast at startup if these are unset, which is
# the point (see JwtTokenProvider / QrSignatureService).
#
# Create the real Secret imperatively so the values never touch git:
#
#   kubectl create secret generic qrserve-secrets \
#     --from-literal=jwt-secret="$(openssl rand -base64 48)" \
#     --from-literal=qr-signature-secret="$(openssl rand -base64 32)" \
#     --from-literal=db-password="$(openssl rand -base64 24)"
#
# Rotating jwt-secret invalidates every issued access and refresh token —
# all users must re-authenticate. Schedule rotation accordingly.
#
# NOTE: db-password must match the password the Postgres pod is created with
# (k8s/postgres-deployment.yaml also reads db-password from this Secret).
apiVersion: v1
kind: Secret
metadata:
  name: qrserve-secrets
type: Opaque
stringData:
  jwt-secret: ""
  qr-signature-secret: ""
  db-password: ""
