apiVersion: apps/v1
kind: Deployment
metadata:
  name: back-office-service
  namespace: default
spec:
  replicas: 2
  selector:
    matchLabels:
      app: back-office-service
  template:
    metadata:
      labels:
        app: back-office-service
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values: ["back-office-service"]
              topologyKey: topology.kubernetes.io/zone
      containers:
      - name: back-office-service
        image: qrserve-back-office-service:latest
        ports:
        - containerPort: 8090
        env:
        - name: SPRING_PROFILES_ACTIVE
          value: "prod"
        # qrserve_backoffice does not exist on the shared Postgres VM yet —
        # this is a required, one-time manual DBA step. See the Phase 0
        # rollout runbook, step "Create the missing qrserve_backoffice
        # database" — this pod will crash-loop until that's done.
        - name: DATABASE_URL
          value: "jdbc:postgresql://postgres-db:5432/qrserve_backoffice"
        - name: DATABASE_USERNAME
          value: "postgres"
        - name: DATABASE_PASSWORD
          valueFrom:
            secretKeyRef: { name: qrserve-secrets, key: db-password }
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef: { name: qrserve-secrets, key: jwt-secret }
        - name: QR_SIGNATURE_SECRET
          valueFrom:
            secretKeyRef: { name: qrserve-secrets, key: qr-signature-secret }
        - name: PUBLIC_BASE_DOMAIN
          valueFrom:
            configMapKeyRef: { name: qrserve-config, key: public-base-domain }
        - name: PUBLIC_MENU_DOMAIN
          valueFrom:
            configMapKeyRef: { name: qrserve-config, key: public-menu-domain }
        - name: MERCHANT_SERVICE_URL
          value: "http://merchant-service:8085"
        - name: EUREKA_SERVER_URL
          value: "http://discovery-service:8761/eureka"
        resources:
          requests: { cpu: "200m", memory: "512Mi" }
          limits: { cpu: "600m", memory: "1Gi" }
        livenessProbe:
          httpGet:
            path: /actuator/health/liveness
            port: 8090
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: 8090
          initialDelaySeconds: 15
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: back-office-service
  namespace: default
  annotations:
    service.kubernetes.io/topology-mode: Auto
spec:
  ports:
    - port: 8090
      targetPort: 8090
  selector:
    app: back-office-service
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: back-office-service-hpa
  namespace: default
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: back-office-service }
  minReplicas: 1
  maxReplicas: 4
  metrics:
  - type: Resource
    resource: { name: cpu, target: { type: Utilization, averageUtilization: 75 } }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: back-office-service-pdb
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: back-office-service
