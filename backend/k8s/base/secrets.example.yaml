# QRServe required secrets — TEMPLATE ONLY.
#
# Do NOT commit a filled-in copy of this file, and do NOT `kubectl apply -k`
# it as part of the base — it is deliberately excluded from
# base/kustomization.yaml's resources list. Create the real Secret
# imperatively so the values never touch git:
#
#   kubectl create secret generic qrserve-secrets \
#     --from-literal=jwt-secret="$(openssl rand -base64 48)" \
#     --from-literal=qr-signature-secret="$(openssl rand -base64 32)" \
#     --from-literal=db-password="<the real Postgres VM password>"
#
# Rotating jwt-secret invalidates every issued access and refresh token —
# all users must re-authenticate. Schedule rotation accordingly.
#
# NOTE: db-password must match the real Postgres VM's password for the
# `postgres` user referenced by every service's DATABASE_USERNAME.
apiVersion: v1
kind: Secret
metadata:
  name: qrserve-secrets
type: Opaque
stringData:
  jwt-secret: ""
  qr-signature-secret: ""
  db-password: ""
