# QRServe non-secret configuration.
#
# Unlike k8s/base/secrets.example.yaml, this one is meant to be committed and
# applied as-is: nothing here is sensitive. It exists because every service
# that component-scans com.qrserve.shared.common instantiates PublicMenuUrl,
# which requires app.public-base-domain and has no default — a default would
# let a service start while emitting QR codes that point at the wrong host,
# and that failure is discovered by a customer holding a phone rather than by
# whoever ran the deploy.
#
# Changing public-base-domain changes every QR code generated from then on.
# Codes already printed onto table stands keep pointing at the old host, so
# treat this value as permanent once the first stand is printed.
apiVersion: v1
kind: ConfigMap
metadata:
  name: qrserve-config
data:
  # Each merchant is served at {merchantSlug}.<this value>. Requires wildcard DNS
  # and a wildcard TLS certificate for *.<this value> (see k8s/base/ingress.yaml).
  public-base-domain: "qrserve.safaricom.et"
  # The phase-1 digital-menu URL family (/m/{merchant-slug}[/{branch-slug}]),
  # required by DigitalMenuUrl the same way public-base-domain is required by
  # PublicMenuUrl above. Deliberately a sibling domain, not a subdomain of
  # public-base-domain (menu.qrserve.safaricom.et would work too now that
  # "menu" is a reserved label in Slugs.RESERVED_LABELS, but a separate
  # domain avoids depending on that reservation staying correct forever).
  # Requires its own DNS + TLS certificate; not wildcarded, since only one
  # host is served here.
  public-menu-domain: "menu.safaricom.et"
