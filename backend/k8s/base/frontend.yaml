# The merchant/customer web app: the built Vite SPA served by nginx.
#
# NOTE ON CONFIGURATION — this Deployment intentionally has NO `env:` block.
#
# The app is a client-side bundle. Vite substitutes `import.meta.env.VITE_*`
# at BUILD time, so the API base URL and WebSocket URL are literals compiled
# into the JavaScript. Environment variables set here would never be read by
# anything: the browser runs the bundle, not this container. Pointing the app
# at a different backend therefore means rebuilding the IMAGE with different
# `--build-arg` values, not editing this file. See the repo-root Dockerfile.
#
# The images are built with the same-origin defaults ("/api", "/ws"), which
# ingress.yaml routes to the gateway — so one image is valid for every site
# and nothing here needs per-environment substitution.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-deployment
  namespace: default
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  # No `strategy:` here on purpose — kustomization.yaml patches a surge-only
  # RollingUpdate onto every Deployment in the base, so declaring it again
  # here would just be a second copy to drift from.
  template:
    metadata:
      labels:
        app: frontend
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values: ["frontend"]
              topologyKey: topology.kubernetes.io/zone
      containers:
      - name: frontend
        image: qrserve-frontend:latest
        ports:
        - containerPort: 80
        resources:
          # An order of magnitude below the JVM services: this is nginx
          # sending files off local disk, with no runtime, heap or JIT.
          requests: { cpu: "50m", memory: "64Mi" }
          limits: { cpu: "300m", memory: "192Mi" }
        livenessProbe:
          httpGet:
            path: /healthz
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /healthz
            port: 80
          initialDelaySeconds: 2
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  namespace: default
spec:
  ports:
    - port: 80
      targetPort: 80
  selector:
    app: frontend
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: frontend-hpa
  namespace: default
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: frontend-deployment }
  minReplicas: 2
  maxReplicas: 6
  metrics:
  - type: Resource
    resource: { name: cpu, target: { type: Utilization, averageUtilization: 70 } }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: frontend-pdb
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: frontend
