apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway-deployment
  namespace: default
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values: ["api-gateway"]
              topologyKey: topology.kubernetes.io/zone
      containers:
      - name: api-gateway
        image: qrserve-api-gateway:latest
        ports:
        - containerPort: 8081
        env:
        - name: SPRING_PROFILES_ACTIVE
          value: "prod"
        - name: REDIS_HOST
          value: "redis-cache"
        - name: REDIS_PORT
          value: "6379"
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef: { name: qrserve-secrets, key: jwt-secret }
        - name: QR_SIGNATURE_SECRET
          valueFrom:
            secretKeyRef: { name: qrserve-secrets, key: qr-signature-secret }
        - name: PUBLIC_BASE_DOMAIN
          valueFrom:
            configMapKeyRef: { name: qrserve-config, key: public-base-domain }
        - name: PUBLIC_MENU_DOMAIN
          valueFrom:
            configMapKeyRef: { name: qrserve-config, key: public-menu-domain }
        # Both of these were previously unset — the single biggest gap this
        # Phase 0 pass fixes. Every route in this gateway is `lb://<service>`
        # (see application.yml), which is resolved via this pod's OWN Eureka
        # client. With EUREKA_SERVER_URL unset it defaulted to
        # http://localhost:8761/eureka (itself — nothing listens there), so
        # `lb://` could never resolve a single instance: every route through
        # this gateway had no working backend. TenantSlugResolver similarly
        # defaulted MERCHANT_SERVICE_URL to http://localhost:8085, breaking
        # tenant-host resolution the same way. See the Phase 0 rollout runbook.
        - name: EUREKA_SERVER_URL
          value: "http://discovery-service:8761/eureka"
        - name: MERCHANT_SERVICE_URL
          value: "http://merchant-service:8085"
        resources:
          requests: { cpu: "500m", memory: "768Mi" }
          limits: { cpu: "1", memory: "1.5Gi" }
        livenessProbe:
          httpGet:
            path: /actuator/health/liveness
            port: 8081
          initialDelaySeconds: 20
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: 8081
          initialDelaySeconds: 10
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway-service
  namespace: default
spec:
  ports:
    - port: 8081
      targetPort: 8081
  selector:
    app: api-gateway
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api-gateway-hpa
  namespace: default
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: api-gateway-deployment }
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource: { name: cpu, target: { type: Utilization, averageUtilization: 70 } }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: api-gateway-pdb
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: api-gateway
