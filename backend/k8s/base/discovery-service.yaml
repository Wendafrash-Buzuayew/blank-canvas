# Eureka registry server. Nothing in this cluster can do lb:// routing or
# service registration without this running FIRST — see the Phase 0 rollout
# runbook (docs/superpowers/plans/2026-09-16-multi-dc-phase0-bp-rollout.md)
# for why this was previously missing entirely from backend/k8s and what that
# broke.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: discovery-service
  namespace: default
spec:
  replicas: 2
  selector:
    matchLabels:
      app: discovery-service
  template:
    metadata:
      labels:
        app: discovery-service
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values: ["discovery-service"]
              topologyKey: topology.kubernetes.io/zone
      containers:
      - name: discovery-service
        image: qrserve-discovery-service:latest
        ports:
        - containerPort: 8761
        env:
        - name: SPRING_PROFILES_ACTIVE
          value: "prod"
        resources:
          requests: { cpu: "150m", memory: "384Mi" }
          limits: { cpu: "400m", memory: "512Mi" }
        livenessProbe:
          httpGet:
            path: /actuator/health/liveness
            port: 8761
          initialDelaySeconds: 20
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: 8761
          initialDelaySeconds: 10
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: discovery-service
  namespace: default
spec:
  ports:
    - port: 8761
      targetPort: 8761
  selector:
    app: discovery-service
---
# No HPA: Eureka's load is proportional to registered-instance count, not
# request volume, so it doesn't need to autoscale with traffic.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: discovery-service-pdb
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: discovery-service
