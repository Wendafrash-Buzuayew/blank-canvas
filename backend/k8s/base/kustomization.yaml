apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Every real backend service + shared infra, for one site. A site is stood
# up with `kubectl apply -k overlays/site-<name>`, never by hand-copying
# these files — see docs/superpowers/plans/2026-09-16-multi-dc-phase0-bp-rollout.md.
#
# Deliberately NOT listed here:
#   - secrets.example.yaml — a template, never applied directly (see its own
#     header comment for the `kubectl create secret` command instead).
#   - ../postgres-deployment.yaml / ../redis-deployment.yaml — the
#     local/dev-only in-cluster Postgres/Redis path, mutually exclusive with
#     data-tier-external.yaml's ExternalName Services used here.
resources:
  - config.yaml
  - data-tier-external.yaml
  - ingress.yaml
  - kafka.yaml
  - discovery-service.yaml
  - auth-service.yaml
  - merchant-service.yaml
  - menu-service.yaml
  - order-service.yaml
  - qr-service.yaml
  - notification-service.yaml
  - analytics-service.yaml
  - back-office-service.yaml
  - api-gateway.yaml
  - frontend.yaml
  - network-policies.yaml

# Surge-only rollouts for every Deployment in the base.
#
# Expressed as one patch against `kind: Deployment` rather than repeated in
# each of the twelve manifests: the policy is identical everywhere, and the
# failure mode of copying it by hand is that one service silently keeps the
# default `maxUnavailable: 25%` and is the only thing that sheds capacity
# mid-deploy.
#
# maxUnavailable MUST stay 0 while the PodDisruptionBudgets in these files
# use `minAvailable: 1` against `replicas: 2` — the default 25% would allow
# the rollout itself to take a service down to one pod, leaving no headroom
# for a concurrent node drain.
patches:
  - target:
      kind: Deployment
    patch: |-
      - op: add
        path: /spec/strategy
        value:
          type: RollingUpdate
          rollingUpdate:
            maxUnavailable: 0
            maxSurge: 1

  # Kafka is the one exception, and must stay one. It is a single-node KRaft
  # broker (replicas: 1, a fixed KAFKA_NODE_ID, and itself as the sole
  # controller-quorum voter). Surging would start a SECOND broker claiming
  # the same node ID and advertising through the same Service before the
  # first exits — producers would be handed a broker that is about to
  # terminate, and the new node can fail to take over the quorum.
  #
  # Recreate accepts a short outage instead, which is the correct trade for a
  # single-replica stateful component. Applied after the blanket patch above,
  # so it wins; `op: add` on an existing path replaces the whole value, which
  # also drops the inherited rollingUpdate block (Kubernetes rejects a
  # Recreate strategy that still carries one).
  #
  # Revisit only when Kafka becomes a multi-broker StatefulSet, at which
  # point it leaves this file's remit anyway.
  - target:
      kind: Deployment
      name: kafka-deployment
    patch: |-
      - op: add
        path: /spec/strategy
        value:
          type: Recreate

  # Container hardening, for every Deployment (each has exactly one
  # container, hence containers/0). No readOnlyRootFilesystem: Spring/Tomcat
  # write to /tmp, the filesystem media backend writes ./uploads, and Kafka
  # keeps its log dir under /tmp.
  - target:
      kind: Deployment
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/securityContext
        value:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
          seccompProfile:
            type: RuntimeDefault

  # runAsNonRoot for every image we build: each Dockerfile ends in a numeric
  # USER (10001 for the services, 101 for nginx-unprivileged), which is what
  # lets the kubelet verify it.
  - target:
      kind: Deployment
    patch: |-
      - op: add
        path: /spec/template/spec/securityContext
        value:
          runAsNonRoot: true

  # ...except Kafka: apache/kafka declares a non-numeric USER (appuser), which
  # the kubelet refuses to start under runAsNonRoot. It does not run as root
  # regardless. Must stay AFTER the patch above.
  - target:
      kind: Deployment
      name: kafka-deployment
    patch: |-
      - op: remove
        path: /spec/template/spec/securityContext/runAsNonRoot
