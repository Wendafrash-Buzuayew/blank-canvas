apiVersion: apps/v1
kind: Deployment
metadata:
  name: menu-service
  namespace: default
spec:
  replicas: 3
  selector:
    matchLabels:
      app: menu-service
  template:
    metadata:
      labels:
        app: menu-service
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values: ["menu-service"]
              topologyKey: topology.kubernetes.io/zone
      containers:
      - name: menu-service
        image: qrserve-menu-service:latest
        ports:
        - containerPort: 8086
        env:
        - name: SPRING_PROFILES_ACTIVE
          value: "prod"
        - name: DATABASE_URL
          value: "jdbc:postgresql://postgres-db:5432/qrserve_menu"
        - name: DATABASE_USERNAME
          value: "postgres"
        - name: DATABASE_PASSWORD
          valueFrom:
            secretKeyRef: { name: qrserve-secrets, key: db-password }
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef: { name: qrserve-secrets, key: jwt-secret }
        - name: QR_SIGNATURE_SECRET
          valueFrom:
            secretKeyRef: { name: qrserve-secrets, key: qr-signature-secret }
        - name: PUBLIC_BASE_DOMAIN
          valueFrom:
            configMapKeyRef: { name: qrserve-config, key: public-base-domain }
        - name: PUBLIC_MENU_DOMAIN
          valueFrom:
            configMapKeyRef: { name: qrserve-config, key: public-menu-domain }
        - name: REDIS_HOST
          value: "redis-cache"
        - name: REDIS_PORT
          value: "6379"
        - name: MERCHANT_SERVICE_URL
          value: "http://merchant-service:8085"
        - name: EUREKA_SERVER_URL
          value: "http://discovery-service:8761/eureka"
        resources:
          requests: { cpu: "200m", memory: "512Mi" }
          limits: { cpu: "600m", memory: "1Gi" }
        livenessProbe:
          httpGet:
            path: /actuator/health/liveness
            port: 8086
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: 8086
          initialDelaySeconds: 15
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: menu-service
  namespace: default
  annotations:
    service.kubernetes.io/topology-mode: Auto
spec:
  ports:
    - port: 8086
      targetPort: 8086
  selector:
    app: menu-service
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: menu-service-hpa
  namespace: default
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: menu-service }
  minReplicas: 2
  maxReplicas: 8
  metrics:
  - type: Resource
    resource: { name: cpu, target: { type: Utilization, averageUtilization: 75 } }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: menu-service-pdb
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: menu-service
