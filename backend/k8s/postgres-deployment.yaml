# LOCAL/DEV ONLY. Not part of the BP (or any real site's) production path —
# every service's DATABASE_URL there is postgres-db, which base/data-tier-
# external.yaml points at the real Postgres VM via ExternalName. This file's
# own Service (postgres-service, below) has a different name for exactly
# that reason: applying both never conflicts, but applying this one in a
# real environment just runs an extra, unused, single-replica Postgres pod
# with no backups. Use it only if you have no VM Postgres to point at yet.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-deployment
  labels:
    app: postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: "qrserve_auth"
            # Every service's DATABASE_USERNAME is "postgres" (see
            # backend/k8s/base/*.yaml) — this must match, not "qrserve_user"
            # as it previously did, or every service using this pod fails to
            # authenticate at startup.
            - name: POSTGRES_USER
              value: "postgres"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: qrserve-secrets
                  key: db-password
          volumeMounts:
            - name: init-scripts
              mountPath: /docker-entrypoint-initdb.d
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
      volumes:
        - name: init-scripts
          configMap:
            name: postgres-init-scripts
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init-scripts
data:
  init-db.sql: |
    CREATE DATABASE qrserve_auth;
    CREATE DATABASE qrserve_merchant;
    CREATE DATABASE qrserve_menu;
    CREATE DATABASE qrserve_order;
    CREATE DATABASE qrserve_qr;
    CREATE DATABASE qrserve_notification;
    CREATE DATABASE qrserve_analytics;
    CREATE DATABASE qrserve_backoffice;
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-service
spec:
  type: ClusterIP
  ports:
    - port: 5432
      targetPort: 5432
  selector:
    app: postgres