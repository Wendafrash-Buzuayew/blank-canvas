apiVersion: apps/v1
kind: Deployment
metadata:
  name: qrserve-backend-deployment
  labels:
    app: qrserve-backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: qrserve-backend
  template:
    metadata:
      labels:
        app: qrserve-backend
    spec:
      containers:
        - name: qrserve-backend
          image: qrserve/backend:latest
          ports:
            - containerPort: 8080
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "prod"
            - name: DATABASE_URL
              value: "jdbc:postgresql://postgres-service:5432/qrserve_db"
            - name: REDIS_HOST
              value: "redis-service"
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2"
              memory: "2Gi"
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: qrserve-backend-service
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: 8080
  selector:
    app: qrserve-backend
