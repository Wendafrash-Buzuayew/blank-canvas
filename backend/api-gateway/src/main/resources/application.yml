server:
  port: 8081

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          discovery:
            locator:
              enabled: true
              lower-case-service-id: true
          globalcors:
            cors-configurations:
              '[/**]':
                allowedOriginPatterns: "*"
                allowedMethods:
                  - GET
                  - POST
                  - PUT
                  - PATCH
                  - DELETE
                  - OPTIONS
                allowedHeaders: "*"
                allowCredentials: true

          # NOTE: resilience filters are applied per-route below rather than via
          # default-filters, because the notification-service /ws/** route must
          # NOT be wrapped — a CircuitBreaker around a long-lived WebSocket, and
          # a Retry on the upgrade GET, both break the connection.
          routes:
            # Auth Service Route.
            # /api/v1/auth/** is listed explicitly and FIRST so it cannot be
            # swallowed by the merchant route's /api/v1/** catch-all below
            # (routes match in declaration order).
            - id: auth-service
              uri: lb://auth-service
              predicates:
                - Path=/api/auth/**, /api/v1/auth/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: default
                    fallbackUri: forward:/fallback
                - name: Retry
                  args:
                    retries: 2
                    methods: GET
                    backoff:
                      firstBackoff: 50ms
                      maxBackoff: 500ms
                      factor: 2

            # Merchant Service Route (includes v1 public/waiter/table endpoints)
            - id: merchant-service
              uri: lb://merchant-service
              predicates:
                - Path=/api/merchants/**, /api/branches/**, /api/tables/**, /api/waiters/**, /api/table-assignments/**, /api/customer-requests/**, /api/v1/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: default
                    fallbackUri: forward:/fallback
                - name: Retry
                  args:
                    retries: 2
                    methods: GET
                    backoff:
                      firstBackoff: 50ms
                      maxBackoff: 500ms
                      factor: 2

            # Order Service Route
            - id: order-service
              uri: lb://order-service
              predicates:
                - Path=/api/orders/**, /api/kitchen/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: default
                    fallbackUri: forward:/fallback
                - name: Retry
                  args:
                    retries: 2
                    methods: GET
                    backoff:
                      firstBackoff: 50ms
                      maxBackoff: 500ms
                      factor: 2

            # Menu Service Route
            - id: menu-service
              uri: lb://menu-service
              predicates:
                - Path=/api/categories/**, /api/products/**, /api/menu/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: default
                    fallbackUri: forward:/fallback
                - name: Retry
                  args:
                    retries: 2
                    methods: GET
                    backoff:
                      firstBackoff: 50ms
                      maxBackoff: 500ms
                      factor: 2

            # QR Service Route
            - id: qr-service
              uri: lb://qr-service
              predicates:
                - Path=/api/qr/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: default
                    fallbackUri: forward:/fallback
                - name: Retry
                  args:
                    retries: 2
                    methods: GET
                    backoff:
                      firstBackoff: 50ms
                      maxBackoff: 500ms
                      factor: 2

            # Analytics Service Route
            - id: analytics-service
              uri: lb://analytics-service
              predicates:
                - Path=/api/analytics/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: default
                    fallbackUri: forward:/fallback
                - name: Retry
                  args:
                    retries: 2
                    methods: GET
                    backoff:
                      firstBackoff: 50ms
                      maxBackoff: 500ms
                      factor: 2

            # Notification Service Route (WebSocket)
            - id: notification-service
              uri: lb://notification-service
              predicates:
                - Path=/ws/**

  main:
    web-application-type: reactive
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2000ms

# The tenant base domain. Required, with no default: PublicMenuUrl is a
# @Component in com.qrserve.shared.common, which every one of these services
# component-scans, and a default would let a service start while emitting QR
# codes that point at the wrong host. A wrong-but-plausible printed QR code is
# discovered by a customer holding a phone; a startup failure is discovered by
# whoever ran the deploy.
# Used by TenantSlugResolver for slug -> merchantId lookups on a cache miss. A
# configured URL rather than lb:// so tenant resolution, which runs ahead of
# routing on every cache-missing request, does not depend on load-balancer state.
services:
  merchant-service-url: ${MERCHANT_SERVICE_URL:http://localhost:8085}

app:
  public-base-domain: ${PUBLIC_BASE_DOMAIN}
  public-url-scheme: ${PUBLIC_URL_SCHEME:https}

# Required even though the gateway does no QR work itself: ApiGatewayApplication
# component-scans com.qrserve.shared.common (and the build adds shared:common to
# every microservice), so QrSignatureService is instantiated here and fails fast
# without this property.
qr:
  signature-secret: ${QR_SIGNATURE_SECRET}
  # Verify-only. Set to the OUTGOING secret during a rotation so QR codes
  # already printed onto table stands keep validating; clear it once
  # reprinting is done. Signing always uses signature-secret above.
  signature-secret-previous: ${QR_SIGNATURE_SECRET_PREVIOUS:}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka}
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: true

resilience4j:
  circuitbreaker:
    instances:
      default:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus, metrics
  endpoint:
    health:
      show-details: when_authorized
  tracing:
    sampling:
      probability: ${TRACE_SAMPLE_RATE:0.1}

logging:
  pattern:
    level: "%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]"
  level:
    org.springframework.cloud.gateway: ${GATEWAY_LOG_LEVEL:INFO}
    org.springframework.security: ${SECURITY_LOG_LEVEL:INFO}
    reactor.netty: ${NETTY_LOG_LEVEL:INFO}