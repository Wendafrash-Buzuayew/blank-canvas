version: '3.8'

services:
  # S3-compatible object storage for uploaded product/branding images
  # (app.media.backend=s3). Not needed when MEDIA_BACKEND is left at its
  # "filesystem" default. Speaks the real S3 API, so the exact same
  # S3MediaStorageService code works against real AWS S3 or another
  # S3-compatible provider in a cloud deployment — only endpoint/credentials
  # change.
  minio:
    image: minio/minio:latest
    container_name: qrserve-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-minioadmin}
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # --- Microservices (using existing external containers for postgres, redis, kafka) ---
  discovery-service:
    build:
      context: .
      dockerfile: discovery-service/Dockerfile
    container_name: qrserve-discovery-service
    ports:
      - "8761:8761"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8761/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  auth-service:
    build:
      context: .
      dockerfile: auth-service/Dockerfile
    container_name: qrserve-auth-service
    ports:
      - "8087:8087"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - DATABASE_URL=jdbc:postgresql://host.docker.internal:5432/qrserve_auth
      - DATABASE_USERNAME=postgres
      - DATABASE_PASSWORD=postgres
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET must be set}
      - QR_SIGNATURE_SECRET=${QR_SIGNATURE_SECRET:?QR_SIGNATURE_SECRET must be set}
      - QR_SIGNATURE_SECRET_PREVIOUS=${QR_SIGNATURE_SECRET_PREVIOUS:-}
      - PUBLIC_BASE_DOMAIN=${PUBLIC_BASE_DOMAIN:?PUBLIC_BASE_DOMAIN must be set}
      - PUBLIC_MENU_DOMAIN=${PUBLIC_MENU_DOMAIN:?PUBLIC_MENU_DOMAIN must be set}
      - PUBLIC_URL_SCHEME=${PUBLIC_URL_SCHEME:-https}
      - EUREKA_SERVER_URL=http://discovery-service:8761/eureka
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    depends_on:
      discovery-service:
        condition: service_healthy

  merchant-service:
    build:
      context: .
      dockerfile: merchant-service/Dockerfile
    container_name: qrserve-merchant-service
    ports:
      - "8085:8085"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - DATABASE_URL=jdbc:postgresql://host.docker.internal:5432/qrserve_merchant
      - DATABASE_USERNAME=postgres
      - DATABASE_PASSWORD=postgres
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET must be set}
      - QR_SIGNATURE_SECRET=${QR_SIGNATURE_SECRET:?QR_SIGNATURE_SECRET must be set}
      - QR_SIGNATURE_SECRET_PREVIOUS=${QR_SIGNATURE_SECRET_PREVIOUS:-}
      - PUBLIC_BASE_DOMAIN=${PUBLIC_BASE_DOMAIN:?PUBLIC_BASE_DOMAIN must be set}
      - PUBLIC_MENU_DOMAIN=${PUBLIC_MENU_DOMAIN:?PUBLIC_MENU_DOMAIN must be set}
      - PUBLIC_URL_SCHEME=${PUBLIC_URL_SCHEME:-https}
      - BACK_OFFICE_SERVICE_URL=http://back-office-service:8090
      - EUREKA_SERVER_URL=http://discovery-service:8761/eureka
      # Defaults to the filesystem backend (no MinIO dependency); flip
      # MEDIA_BACKEND=s3 to use the minio service defined above instead —
      # same wiring as menu-service's own block below.
      - MEDIA_BACKEND=${MEDIA_BACKEND:-filesystem}
      - MEDIA_UPLOAD_DIR=${MEDIA_UPLOAD_DIR:-/data/uploads}
      - MEDIA_S3_ENDPOINT=http://minio:9000
      - MEDIA_S3_ACCESS_KEY=${MINIO_ROOT_USER:-minioadmin}
      - MEDIA_S3_SECRET_KEY=${MINIO_ROOT_PASSWORD:-minioadmin}
      - MEDIA_S3_PUBLIC_URL_BASE=${MEDIA_S3_PUBLIC_URL_BASE:-http://localhost:9000/qrserve-media}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    depends_on:
      discovery-service:
        condition: service_healthy
      minio:
        condition: service_healthy

  menu-service:
    build:
      context: .
      dockerfile: menu-service/Dockerfile
    container_name: qrserve-menu-service
    ports:
      - "8086:8086"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - DATABASE_URL=jdbc:postgresql://host.docker.internal:5432/qrserve_menu
      - DATABASE_USERNAME=postgres
      - DATABASE_PASSWORD=postgres
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET must be set}
      - QR_SIGNATURE_SECRET=${QR_SIGNATURE_SECRET:?QR_SIGNATURE_SECRET must be set}
      - QR_SIGNATURE_SECRET_PREVIOUS=${QR_SIGNATURE_SECRET_PREVIOUS:-}
      - PUBLIC_BASE_DOMAIN=${PUBLIC_BASE_DOMAIN:?PUBLIC_BASE_DOMAIN must be set}
      - PUBLIC_MENU_DOMAIN=${PUBLIC_MENU_DOMAIN:?PUBLIC_MENU_DOMAIN must be set}
      - PUBLIC_URL_SCHEME=${PUBLIC_URL_SCHEME:-https}
      - MERCHANT_SERVICE_URL=http://merchant-service:8085
      - REDIS_HOST=host.docker.internal
      - REDIS_PORT=6379
      - EUREKA_SERVER_URL=http://discovery-service:8761/eureka
      # Defaults to the filesystem backend (no MinIO dependency); flip
      # MEDIA_BACKEND=s3 to use the minio service defined above instead.
      - MEDIA_BACKEND=${MEDIA_BACKEND:-filesystem}
      - MEDIA_UPLOAD_DIR=${MEDIA_UPLOAD_DIR:-/data/uploads}
      - MEDIA_S3_ENDPOINT=http://minio:9000
      - MEDIA_S3_ACCESS_KEY=${MINIO_ROOT_USER:-minioadmin}
      - MEDIA_S3_SECRET_KEY=${MINIO_ROOT_PASSWORD:-minioadmin}
      - MEDIA_S3_PUBLIC_URL_BASE=${MEDIA_S3_PUBLIC_URL_BASE:-http://localhost:9000/qrserve-media}
      # One-off, opt-in migration (see BranchMenuBackfillRunner) — leave
      # false; flip to true in .env for exactly one restart, then back off.
      - BACKFILL_BRANCH_MENUS_ENABLED=${BACKFILL_BRANCH_MENUS_ENABLED:-false}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    depends_on:
      discovery-service:
        condition: service_healthy
      minio:
        condition: service_healthy

  order-service:
    build:
      context: .
      dockerfile: order-service/Dockerfile
    container_name: qrserve-order-service
    ports:
      - "8083:8083"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - DATABASE_URL=jdbc:postgresql://host.docker.internal:5432/qrserve_order
      - DATABASE_USERNAME=postgres
      - DATABASE_PASSWORD=postgres
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET must be set}
      - QR_SIGNATURE_SECRET=${QR_SIGNATURE_SECRET:?QR_SIGNATURE_SECRET must be set}
      - QR_SIGNATURE_SECRET_PREVIOUS=${QR_SIGNATURE_SECRET_PREVIOUS:-}
      - PUBLIC_BASE_DOMAIN=${PUBLIC_BASE_DOMAIN:?PUBLIC_BASE_DOMAIN must be set}
      - PUBLIC_MENU_DOMAIN=${PUBLIC_MENU_DOMAIN:?PUBLIC_MENU_DOMAIN must be set}
      - PUBLIC_URL_SCHEME=${PUBLIC_URL_SCHEME:-https}
      - KAFKA_BOOTSTRAP_SERVERS=host.docker.internal:9092
      - MERCHANT_SERVICE_URL=http://merchant-service:8085
      - MENU_SERVICE_URL=http://menu-service:8086
      - EUREKA_SERVER_URL=http://discovery-service:8761/eureka
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    depends_on:
      discovery-service:
        condition: service_healthy

  qr-service:
    build:
      context: .
      dockerfile: qr-service/Dockerfile
    container_name: qrserve-qr-service
    ports:
      - "8088:8088"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - DATABASE_URL=jdbc:postgresql://host.docker.internal:5432/qrserve_qr
      - DATABASE_USERNAME=postgres
      - DATABASE_PASSWORD=postgres
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET must be set}
      - QR_SIGNATURE_SECRET=${QR_SIGNATURE_SECRET:?QR_SIGNATURE_SECRET must be set}
      - QR_SIGNATURE_SECRET_PREVIOUS=${QR_SIGNATURE_SECRET_PREVIOUS:-}
      - PUBLIC_BASE_DOMAIN=${PUBLIC_BASE_DOMAIN:?PUBLIC_BASE_DOMAIN must be set}
      - PUBLIC_MENU_DOMAIN=${PUBLIC_MENU_DOMAIN:?PUBLIC_MENU_DOMAIN must be set}
      - PUBLIC_URL_SCHEME=${PUBLIC_URL_SCHEME:-https}
      - MERCHANT_SERVICE_URL=http://merchant-service:8085
      - EUREKA_SERVER_URL=http://discovery-service:8761/eureka
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    depends_on:
      discovery-service:
        condition: service_healthy

  notification-service:
    build:
      context: .
      dockerfile: notification-service/Dockerfile
    container_name: qrserve-notification-service
    ports:
      - "8084:8084"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - DATABASE_URL=jdbc:postgresql://host.docker.internal:5432/qrserve_notification
      - DATABASE_USERNAME=postgres
      - DATABASE_PASSWORD=postgres
      - REDIS_HOST=host.docker.internal  
      - REDIS_PORT=6379                   
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET must be set}
      - QR_SIGNATURE_SECRET=${QR_SIGNATURE_SECRET:?QR_SIGNATURE_SECRET must be set}
      - QR_SIGNATURE_SECRET_PREVIOUS=${QR_SIGNATURE_SECRET_PREVIOUS:-}
      - PUBLIC_BASE_DOMAIN=${PUBLIC_BASE_DOMAIN:?PUBLIC_BASE_DOMAIN must be set}
      - PUBLIC_MENU_DOMAIN=${PUBLIC_MENU_DOMAIN:?PUBLIC_MENU_DOMAIN must be set}
      - PUBLIC_URL_SCHEME=${PUBLIC_URL_SCHEME:-https}
      - EUREKA_SERVER_URL=http://discovery-service:8761/eureka
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    depends_on:
      discovery-service:
        condition: service_healthy

  analytics-service:
    build:
      context: .
      dockerfile: analytics-service/Dockerfile
    container_name: qrserve-analytics-service
    ports:
      - "8089:8089"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - DATABASE_URL=jdbc:postgresql://host.docker.internal:5432/qrserve_analytics
      - DATABASE_USERNAME=postgres
      - DATABASE_PASSWORD=postgres
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET must be set}
      - QR_SIGNATURE_SECRET=${QR_SIGNATURE_SECRET:?QR_SIGNATURE_SECRET must be set}
      - QR_SIGNATURE_SECRET_PREVIOUS=${QR_SIGNATURE_SECRET_PREVIOUS:-}
      - PUBLIC_BASE_DOMAIN=${PUBLIC_BASE_DOMAIN:?PUBLIC_BASE_DOMAIN must be set}
      - PUBLIC_MENU_DOMAIN=${PUBLIC_MENU_DOMAIN:?PUBLIC_MENU_DOMAIN must be set}
      - PUBLIC_URL_SCHEME=${PUBLIC_URL_SCHEME:-https}
      - MERCHANT_SERVICE_URL=http://merchant-service:8085
      - ORDER_SERVICE_URL=http://order-service:8083
      - EUREKA_SERVER_URL=http://discovery-service:8761/eureka
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    depends_on:
      discovery-service:
        condition: service_healthy

  back-office-service:
    build:
      context: .
      dockerfile: back-office-service/Dockerfile
    container_name: qrserve-back-office-service
    ports:
      - "8090:8090"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - DATABASE_URL=jdbc:postgresql://host.docker.internal:5432/qrserve_backoffice
      - DATABASE_USERNAME=postgres
      - DATABASE_PASSWORD=postgres
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET must be set}
      - QR_SIGNATURE_SECRET=${QR_SIGNATURE_SECRET:?QR_SIGNATURE_SECRET must be set}
      - QR_SIGNATURE_SECRET_PREVIOUS=${QR_SIGNATURE_SECRET_PREVIOUS:-}
      - PUBLIC_BASE_DOMAIN=${PUBLIC_BASE_DOMAIN:?PUBLIC_BASE_DOMAIN must be set}
      - PUBLIC_MENU_DOMAIN=${PUBLIC_MENU_DOMAIN:?PUBLIC_MENU_DOMAIN must be set}
      - PUBLIC_URL_SCHEME=${PUBLIC_URL_SCHEME:-https}
      - MERCHANT_SERVICE_URL=http://merchant-service:8085
      - EUREKA_SERVER_URL=http://discovery-service:8761/eureka
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    depends_on:
      discovery-service:
        condition: service_healthy

  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    container_name: qrserve-api-gateway
    ports:
      - "8081:8081"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET must be set}
      - QR_SIGNATURE_SECRET=${QR_SIGNATURE_SECRET:?QR_SIGNATURE_SECRET must be set}
      - QR_SIGNATURE_SECRET_PREVIOUS=${QR_SIGNATURE_SECRET_PREVIOUS:-}
      - PUBLIC_BASE_DOMAIN=${PUBLIC_BASE_DOMAIN:?PUBLIC_BASE_DOMAIN must be set}
      - PUBLIC_MENU_DOMAIN=${PUBLIC_MENU_DOMAIN:?PUBLIC_MENU_DOMAIN must be set}
      - PUBLIC_URL_SCHEME=${PUBLIC_URL_SCHEME:-https}
      - MERCHANT_SERVICE_URL=http://merchant-service:8085
      - REDIS_HOST=host.docker.internal
      - REDIS_PORT=6379
      - EUREKA_SERVER_URL=http://discovery-service:8761/eureka
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    depends_on:
      discovery-service:
        condition: service_healthy
      auth-service:
        condition: service_started
      merchant-service:
        condition: service_started
      menu-service:
        condition: service_started
      order-service:
        condition: service_started
      qr-service:
        condition: service_started
      notification-service:
        condition: service_started
      analytics-service:
        condition: service_started
      back-office-service:
        condition: service_started

volumes:
  minio-data: