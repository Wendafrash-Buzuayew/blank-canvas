# Serves the built Vite SPA. Paired with the frontend image (see Dockerfile).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # nginx only gzips text/html by default; the bundle is JS and CSS, which
    # is where practically all of the transfer size is.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Probe target for the Deployment. A plain 200 from nginx — deliberately
    # NOT proxied to the backend, because this answers "can this pod serve
    # the bundle", and a pod that is fine should not be restarted because the
    # gateway is having a bad minute.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Vite emits content-hashed filenames under /assets, so a given URL's
    # bytes never change and it can be cached indefinitely.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        # SPA history fallback. react-router owns every path, so a deep link
        # or a refresh on /merchant/menu must return index.html rather than
        # nginx's 404 — that is the single most common way a client-routed
        # app breaks once it is behind a real web server.
        try_files $uri $uri/ /index.html;

        # index.html is the bootstrap that names the hashed bundles, so it
        # must never be cached: a stale copy pins the browser to the previous
        # deploy's assets, which then 404 once they are cleaned up.
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
